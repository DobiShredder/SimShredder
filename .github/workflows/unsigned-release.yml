name: Prepare unsigned 0.x release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.x tag for candidate artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release input before checking out or executing repository code
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'release tag must be a valid v0.x semantic version' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reject a stale tag or non-public source history before native builds
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          node tooling/release/audit-public-history.mjs

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify the tag is attached to master history
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: node tooling/release/verify-version.mjs "$RELEASE_TAG"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @simshredder/desktop exec tauri build --target ${{ matrix.target }}
      - name: Verify exact macOS release artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/SimShredder.app'
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)
          test "$(printf '%s\n' "$dmg" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          test -x "$app/Contents/MacOS/simshredder-desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '26.0'
          test -f "$app/Contents/Resources/licenses/LICENSE"
          test -f "$app/Contents/Resources/licenses/PRIVACY.md"
          hdiutil verify "$dmg"
          if codesign -dvv "$app" 2>&1 | grep -q '^Authority='; then
            echo 'default release unexpectedly contains an identity signature' >&2
            exit 1
          fi
          mountpoint=$(mktemp -d "$RUNNER_TEMP/simshredder-release.XXXXXX")
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          cp -R "$mountpoint/SimShredder.app" "$RUNNER_TEMP/SimShredder.app"
          hdiutil detach "$mountpoint"
          trap - EXIT
          "$RUNNER_TEMP/SimShredder.app/Contents/MacOS/simshredder-desktop" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
      - name: Verify exact Windows release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $application = 'target/x86_64-pc-windows-msvc/release/simshredder-desktop.exe'
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          if (-not (Test-Path $application) -or $installer.Count -ne 1) { throw 'application or NSIS installer is missing' }
          if ((Get-AuthenticodeSignature $application).Status -ne 'NotSigned') { throw 'default application must be unsigned' }
          if ((Get-AuthenticodeSignature $installer[0].FullName).Status -ne 'NotSigned') { throw 'default installer must be unsigned' }
          node tooling/release/verify-windows-pe.mjs $application
          & './tooling/release/verify-windows-clean-user.ps1' -InstallerPath $installer[0].FullName -Commit (git rev-parse HEAD) -ExpectedAuthenticodeStatus NotSigned -EvidencePath "$env:RUNNER_TEMP/windows-clean-user-evidence.json"
      - name: Stage macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)
          test "$(printf '%s\n' "$dmg" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          cp "$dmg" "release-assets/SimShredder-$RELEASE_TAG-aarch64.dmg"
      - name: Stage Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory release-assets | Out-Null
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "expected one NSIS installer, found $($installer.Count)" }
          Copy-Item $installer[0].FullName "release-assets/SimShredder-$env:RELEASE_TAG-windows-x64-setup.exe"
          New-Item -ItemType Directory release-evidence | Out-Null
          Copy-Item "$env:RUNNER_TEMP/windows-clean-user-evidence.json" 'release-evidence/windows-clean-user-evidence.json'
      - name: Generate commit-bound artifact provenance
        shell: bash
        run: node tooling/release/generate-provenance.mjs "${{ matrix.platform }}" "$(git rev-parse HEAD)" release-assets "${{ matrix.platform }}-provenance.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release-${{ matrix.platform }}
          path: |
            release-assets/
            ${{ matrix.platform }}-provenance.json
            release-evidence/
          if-no-files-found: error
