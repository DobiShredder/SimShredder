name: CI

on:
  workflow_dispatch:
    inputs:
      run_native:
        description: Run the complete macOS and Windows native gate
        required: false
        type: boolean
        default: false
      capture_gui_baselines:
        description: Capture missing platform-native GUI baselines as artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legal-audit:
    if: inputs.run_native && inputs.capture_gui_baselines != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Verify complete locked production license reports
        run: |
          cargo install --locked --features cli --version 0.9.1 cargo-about
          mkdir "$RUNNER_TEMP/release-licenses"
          cargo about generate --config legal/cargo-about/about.toml -o "$RUNNER_TEMP/release-licenses/rust-third-party-licenses.md" legal/cargo-about/about.hbs
          node tooling/licenses/normalize-text-report.mjs "$RUNNER_TEMP/release-licenses/rust-third-party-licenses.md"
          pnpm licenses list --json --prod > "$RUNNER_TEMP/pnpm-licenses.json"
          node tooling/licenses/generate-node-licenses.mjs "$RUNNER_TEMP/pnpm-licenses.json" "$RUNNER_TEMP/release-licenses/node-third-party-licenses.md"
          cmp legal/reports/rust-third-party-licenses.md "$RUNNER_TEMP/release-licenses/rust-third-party-licenses.md"
          cmp legal/reports/node-third-party-licenses.md "$RUNNER_TEMP/release-licenses/node-third-party-licenses.md"

  tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Reject baseline capture without the native gate
        env:
          RUN_NATIVE: ${{ inputs.run_native }}
          CAPTURE_BASELINES: ${{ inputs.capture_gui_baselines }}
        shell: bash
        run: |
          if [[ "$CAPTURE_BASELINES" == 'true' && "$RUN_NATIVE" != 'true' ]]; then
            echo 'capture_gui_baselines requires run_native' >&2
            exit 1
          fi
      - run: node --test tooling/licenses/normalize-text-report.test.mjs tooling/runtime/verify-catalog-artifacts.test.mjs tooling/release/audit-public-history.test.mjs tooling/release/verify-manual-release-evidence.test.mjs tooling/release/verify-unsigned-candidate.test.mjs tooling/release/verify-windows-pe.test.mjs
      - run: node tooling/release/verify-workflow-security.mjs
      - run: node tooling/release/audit-public-history.mjs

  validate:
    if: inputs.run_native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  windows-simc-contract:
    needs: [validate, tooling-tests]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - run: pnpm install --frozen-lockfile
      - name: Download the signed-catalog SimulationCraft archive
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'verified-simc'
          $result = Join-Path $env:RUNNER_TEMP 'verified-simc.json'
          $manifest = Join-Path $env:RUNNER_TEMP 'verified-simc-manifest.json'
          node tooling/runtime/verify-catalog-artifacts.mjs --catalog apps/desktop/src-tauri/resources/runtime-catalog.json --mode full --platform windows --architecture x86_64 --output-directory $download --result-file $result --manifest-file $manifest
          $verified = @(Get-Content $result -Raw | ConvertFrom-Json)
          if ($verified.Count -ne 1) { throw "expected one verified Windows runtime, found $($verified.Count)" }
          $archive = $verified[0].path
          "SIMSHREDDER_WINDOWS_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIMSHREDDER_WINDOWS_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify archive and execute official CLI contract
        shell: pwsh
        run: cargo test -p simc-adapter --test live_windows official_windows_archive_satisfies_the_full_executable_contract -- --ignored --exact
      - name: Prepare the verified archive cache for native GUI E2E
        shell: pwsh
        run: |
          "SIMSHREDDER_E2E_AUTO_INSTALL=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIMSHREDDER_E2E_RUNTIME_ARTIFACT=$env:SIMSHREDDER_WINDOWS_ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: pnpm e2e:build
      - name: Run native Windows ko/en live GUI flow and capture screenshot candidates
        id: windows-e2e
        shell: pwsh
        env:
          SIMSHREDDER_E2E_ACCEPT_BASELINE: ${{ inputs.capture_gui_baselines && '1' || '0' }}
        run: pnpm e2e
      - name: Verify native Windows screenshot evidence exists
        shell: pwsh
        run: |
          $tags = @('home-en-live','settings-en-light-live','import-en-light-live','quick-ko-live','quick-ko-200-percent-live','result-ko-dark','top-gear-ko-live')
          foreach ($directory in @('apps/desktop/tests/e2e/baseline/windows-ci','target/wdio-visual/actual')) {
            foreach ($tag in $tags) {
              $matches = @(Get-ChildItem $directory -File -Filter "$tag-*.png")
              if ($matches.Count -ne 1) { throw "expected one $tag screenshot in $directory, found $($matches.Count)" }
            }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-gui-e2e-evidence
          path: |
            apps/desktop/tests/e2e/baseline/windows-ci/
            target/wdio-visual/
          if-no-files-found: warn

  macos-gui-e2e:
    needs: validate
    runs-on: macos-26
    env:
      SIMSHREDDER_E2E_ACCEPT_BASELINE: ${{ inputs.capture_gui_baselines && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:build
      - name: Run offline GUI regression
        run: pnpm e2e
      - name: Run clean per-user SimC download, install, Character Analysis, and Gear Optimizer flow
        env:
          SIMSHREDDER_E2E_AUTO_INSTALL: "1"
        run: pnpm e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure() || inputs.capture_gui_baselines
        with:
          name: macos-gui-e2e-diff
          path: |
            apps/desktop/tests/e2e/baseline/macos-ci/
            target/wdio-visual/
          if-no-files-found: ignore

  unsigned-installers:
    if: inputs.run_native && inputs.capture_gui_baselines != true
    needs: [legal-audit, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simshredder/desktop exec tauri build --target ${{ matrix.target }}
      - name: Verify macOS bundle contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='target/aarch64-apple-darwin/release/bundle/macos/SimShredder.app'
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -x "$app/Contents/MacOS/simshredder-desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '26.0'
          test -f "$app/Contents/Resources/licenses/LICENSE"
          test -f "$app/Contents/Resources/licenses/rust-third-party-licenses.md"
          test -f "$app/Contents/Resources/licenses/node-third-party-licenses.md"
          hdiutil verify "$dmg"
          mountpoint=$(mktemp -d "$RUNNER_TEMP/simshredder-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$dmg"
          cp -R "$mountpoint/SimShredder.app" "$RUNNER_TEMP/SimShredder.app"
          hdiutil detach "$mountpoint"
          installed="$RUNNER_TEMP/SimShredder.app"
          test -f "$installed/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md"
          "$installed/Contents/MacOS/simshredder-desktop" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
      - name: Verify Windows GUI and NSIS contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $application = 'target/x86_64-pc-windows-msvc/release/simshredder-desktop.exe'
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          if (-not (Test-Path $application) -or $installer.Count -ne 1) { throw 'application or NSIS installer is missing' }
          node tooling/release/verify-windows-pe.mjs $application
          foreach ($license in @('LICENSE','NOTICE','PRIVACY.md','THIRD_PARTY_NOTICES.md','rust-third-party-licenses.md','node-third-party-licenses.md')) {
            if (-not (Test-Path "target/x86_64-pc-windows-msvc/release/licenses/$license")) { throw "bundled license resource is missing: $license" }
          }
          & './tooling/release/verify-windows-clean-user.ps1' -InstallerPath $installer[0].FullName -Commit (git rev-parse HEAD) -ExpectedAuthenticodeStatus NotSigned -EvidencePath 'target/x86_64-pc-windows-msvc/release/bundle/windows-clean-user-evidence.json'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
