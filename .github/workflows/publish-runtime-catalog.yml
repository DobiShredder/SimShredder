name: Refresh signed SimulationCraft runtime catalog

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime-catalog
  cancel-in-progress: false

jobs:
  discovery:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Audit public history
        run: node tooling/release/audit-public-history.mjs
      - name: Compare signed baseline with official listing
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          listing="$RUNNER_TEMP/nightly-listing.html"
          production="$RUNNER_TEMP/production-runtime-catalog.json"
          curl --fail --silent --show-error --max-filesize 2097152 --output "$listing" \
            'http://downloads.simulationcraft.org/nightly/?C=M;O=D'
          status=$(curl --silent --show-error --location --max-redirs 1 --max-filesize 1048576 \
            --output "$production" --write-out '%{http_code}' \
            'https://github.com/DobiShredder/SimShredder/releases/download/simc-runtime-catalog/runtime-catalog.json')
          production_argument=()
          if [[ "$status" == 404 ]]; then
            rm "$production"
          elif [[ "$status" == 200 ]]; then
            production_argument=(--production-catalog "$production")
          else
            echo "production catalog returned HTTP $status" >&2
            exit 1
          fi
          node tooling/runtime/refresh-runtime-catalog.mjs \
            --bundled-catalog apps/desktop/src-tauri/resources/runtime-catalog.json \
            "${production_argument[@]}" \
            --trust-roots apps/desktop/src-tauri/resources/runtime-catalog-trust-roots.json \
            --now "$(date +%s)" --listing-file "$listing" \
            --decision-file "$RUNNER_TEMP/runtime-catalog-decision.json"
          changed=$(node -e 'const fs=require("node:fs");process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1])).changed))' "$RUNNER_TEMP/runtime-catalog-decision.json")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  publish:
    needs: discovery
    if: needs.discovery.outputs.changed == 'true' && github.ref == 'refs/heads/master' && vars.RUNTIME_CATALOG_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Revalidate discovery, download changed artifacts and generate payload
        shell: bash
        run: |
          set -euo pipefail
          node tooling/release/audit-public-history.mjs
          listing="$RUNNER_TEMP/nightly-listing.html"
          production="$RUNNER_TEMP/production-runtime-catalog.json"
          curl --fail --silent --show-error --max-filesize 2097152 --output "$listing" \
            'http://downloads.simulationcraft.org/nightly/?C=M;O=D'
          status=$(curl --silent --show-error --location --max-redirs 1 --max-filesize 1048576 \
            --output "$production" --write-out '%{http_code}' \
            'https://github.com/DobiShredder/SimShredder/releases/download/simc-runtime-catalog/runtime-catalog.json')
          production_argument=()
          if [[ "$status" == 404 ]]; then
            rm "$production"
          elif [[ "$status" == 200 ]]; then
            production_argument=(--production-catalog "$production")
          else
            echo "production catalog returned HTTP $status" >&2
            exit 1
          fi
          generated=$(date +%s)
          expires=$((generated + 7 * 24 * 60 * 60))
          node tooling/runtime/refresh-runtime-catalog.mjs \
            --bundled-catalog apps/desktop/src-tauri/resources/runtime-catalog.json \
            "${production_argument[@]}" \
            --trust-roots apps/desktop/src-tauri/resources/runtime-catalog-trust-roots.json \
            --now "$generated" --listing-file "$listing" \
            --decision-file "$RUNNER_TEMP/runtime-catalog-generation-decision.json" \
            --output-directory "$RUNNER_TEMP/verified-simc" \
            --generated-at "$generated" --expires-at "$expires" \
            --payload-file "$RUNNER_TEMP/runtime-catalog.payload.json"
          echo "generated=$generated" >> "$GITHUB_ENV"
      - name: Sign without exposing the release key
        env:
          RUNTIME_CATALOG_SIGNING_KEY_PEM: ${{ secrets.RUNTIME_CATALOG_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/runtime-catalog-signing-key.pem"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          umask 077
          if [[ -z "$RUNTIME_CATALOG_SIGNING_KEY_PEM" ]]; then
            echo 'release environment is missing RUNTIME_CATALOG_SIGNING_KEY_PEM' >&2
            exit 1
          fi
          printf '%s' "$RUNTIME_CATALOG_SIGNING_KEY_PEM" > "$key_file"
          node tooling/runtime/sign-runtime-catalog.mjs \
            "$RUNNER_TEMP/runtime-catalog.payload.json" "$key_file" runtime-release-2026-a \
            "$RUNNER_TEMP/runtime-catalog.json"
      - name: Verify signed catalog and local artifact bytes before publish
        run: |
          node tooling/runtime/verify-signed-runtime-catalog.mjs \
            --catalog "$RUNNER_TEMP/runtime-catalog.json" \
            --trust-roots apps/desktop/src-tauri/resources/runtime-catalog-trust-roots.json \
            --now "$generated" --artifact-directory "$RUNNER_TEMP/verified-simc"
      - name: Publish with staged asset promotion and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/runtime/publish-runtime-catalog.mjs --catalog "$RUNNER_TEMP/runtime-catalog.json" --repository "$GITHUB_REPOSITORY" --tag simc-runtime-catalog
      - name: Verify production bytes, signature, targets, expiry and availability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-redirs 1 --max-filesize 1048576 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$RUNNER_TEMP/published-runtime-catalog.json" \
            'https://github.com/DobiShredder/SimShredder/releases/download/simc-runtime-catalog/runtime-catalog.json'
          cmp "$RUNNER_TEMP/runtime-catalog.json" "$RUNNER_TEMP/published-runtime-catalog.json"
          node tooling/runtime/verify-signed-runtime-catalog.mjs \
            --catalog "$RUNNER_TEMP/published-runtime-catalog.json" \
            --trust-roots apps/desktop/src-tauri/resources/runtime-catalog-trust-roots.json \
            --now "$generated"
          node tooling/runtime/verify-catalog-artifacts.mjs \
            --catalog "$RUNNER_TEMP/published-runtime-catalog.json" --mode availability
