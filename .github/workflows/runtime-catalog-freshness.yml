name: SimulationCraft runtime catalog freshness

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-catalog-freshness
  cancel-in-progress: true

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Verify the bundled Ed25519 signature and catalog contract
        run: cargo test -p simshredder-runtime-manager --test catalog_resource -- --exact bundled_catalog_has_a_valid_production_signature
      - name: Detect deleted or size-changed official artifacts
        run: node tooling/runtime/verify-catalog-artifacts.mjs --catalog apps/desktop/src-tauri/resources/runtime-catalog.json --mode availability
