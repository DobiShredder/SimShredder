[package]
name = "simshredder-desktop"
version = "0.1.0"
description = "SimShredder desktop application"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "simshredder_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
simshredder-desktop-service = { path = "../../../crates/application/desktop-service" }
simshredder-icon-cache = { path = "../../../crates/infrastructure/icon-cache" }
simshredder-job-runner = { path = "../../../crates/infrastructure/job-runner" }
simshredder-runtime-manager = { path = "../../../crates/infrastructure/runtime-manager" }
simc-adapter = { path = "../../../crates/infrastructure/simc-adapter" }
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-dialog = "2.6.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
